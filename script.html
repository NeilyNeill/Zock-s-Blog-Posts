<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Ledger — a local journal</title>
<style>
  :root {
    --blue: #1a56db;
    --blue-dark: #12409e;
  }

  body {
    background: #eef3fb;
    color: #1a1a1a;
    font-family: Helvetica, Arial, sans-serif;
    font-size: 15px;
    margin: 40px 60px;
  }

  h1 {
    font-size: 1.9rem;
    margin: 0 0 8px;
    color: var(--blue-dark);
  }

  .subtitle {
    margin: 0 0 28px;
    color: #3a4a63;
  }

  #composerIndex { display: none; }

  #composerForm {
    margin-bottom: 24px;
  }

  #titleInput,
  #bodyInput {
    font-family: inherit;
    font-size: 0.95rem;
    padding: 6px 8px;
    border: 1px solid var(--blue);
    border-radius: 2px;
    color: #1a1a1a;
    background: #fff;
  }

  #titleInput {
    width: 180px;
    margin-right: 8px;
  }

  #bodyInput {
    width: 260px;
    height: 40px;
    font-family: 'Courier New', monospace;
    font-size: 0.85rem;
    vertical-align: top;
    resize: both;
  }

  .media-row {
    margin: 8px 0;
  }

  .media-row span {
    margin-right: 4px;
  }

  .media-row input[type="file"] {
    margin-right: 16px;
    font-size: 0.85rem;
  }

  #titleInput:focus,
  #bodyInput:focus {
    outline: 2px solid var(--blue);
    outline-offset: 1px;
  }

  .composer__submit {
    font-family: inherit;
    font-size: 0.9rem;
    padding: 4px 14px;
    border: 1px solid var(--blue);
    border-radius: 2px;
    background: #fff;
    color: var(--blue-dark);
    cursor: pointer;
  }

  .composer__submit:hover {
    background: var(--blue);
    color: #fff;
  }

  #feedEmpty {
    margin-top: 24px;
  }

  .post {
    margin-top: 32px;
    padding-top: 16px;
    border-top: 1px solid #c3d3ec;
  }

  .post:first-of-type {
    border-top: none;
  }

  .post__meta {
    font-size: 0.8rem;
    color: #6b6b6b;
    margin-bottom: 4px;
  }

  .post__index {
    color: var(--blue);
    font-weight: bold;
    margin-right: 10px;
  }

  .post__title {
    font-size: 1.15rem;
    margin: 0 0 6px;
  }

  .post__text {
    margin: 0 0 10px;
    white-space: pre-wrap;
  }

  .post__media {
    margin-bottom: 10px;
  }

  .post__media img,
  .post__media video {
    max-width: 220px;
    max-height: 220px;
    margin: 0 8px 8px 0;
    border: 1px solid #c3d3ec;
    vertical-align: top;
  }

  .post__delete {
    font-family: inherit;
    font-size: 0.8rem;
    padding: 3px 10px;
    border: 1px solid var(--blue);
    border-radius: 2px;
    background: #fff;
    color: var(--blue-dark);
    cursor: pointer;
  }

  .post__delete:hover {
    background: var(--blue);
    color: #fff;
  }
</style>
</head>
<body>

  <h1>Zock's Blog</h1>
  <p class="subtitle">Post whatever, idc.</p>

  <span id="composerIndex">#1</span>

  <form id="composerForm">
    <textarea id="bodyInput" name="body" placeholder="Write something…"></textarea><br />
    <input type="text" id="titleInput" name="title" placeholder="Title" required maxlength="120" />

    <div class="media-row">
      <span>🖼️ Images</span>
      <input type="file" id="imagesInput" name="images" accept="image/*" multiple />
      <span>📎 Video</span>
      <input type="file" id="videoInput" name="video" accept="video/*" />
    </div>

    <button type="submit" class="composer__submit">Publish</button>
  </form>

  <section id="feed" aria-live="polite">
    <p id="feedEmpty">No posts yet — write your first one above.</p>
  </section>

<script>
// ---------------------------------------------
// IndexedDB helpers
// ---------------------------------------------

const DB_NAME = "ledger";
const DB_VERSION = 1;
const STORE_NAME = "posts";

let db;

function openDB() {
  return new Promise((resolve, reject) => {
    const request = indexedDB.open(DB_NAME, DB_VERSION);

    request.onupgradeneeded = (event) => {
      const database = event.target.result;
      if (!database.objectStoreNames.contains(STORE_NAME)) {
        const store = database.createObjectStore(STORE_NAME, {
          keyPath: "id",
          autoIncrement: true,
        });
        store.createIndex("createdAt", "createdAt", { unique: false });
      }
    };

    request.onsuccess = (event) => resolve(event.target.result);
    request.onerror = (event) => reject(event.target.error);
  });
}

function getAllPosts() {
  return new Promise((resolve, reject) => {
    const tx = db.transaction(STORE_NAME, "readonly");
    const store = tx.objectStore(STORE_NAME);
    const request = store.getAll();

    request.onsuccess = () => resolve(request.result);
    request.onerror = () => reject(request.error);
  });
}

function addPostToDB(post) {
  return new Promise((resolve, reject) => {
    const tx = db.transaction(STORE_NAME, "readwrite");
    const store = tx.objectStore(STORE_NAME);
    const request = store.add(post);

    request.onsuccess = () => resolve(request.result);
    request.onerror = () => reject(request.error);
  });
}

function deletePostFromDB(id) {
  return new Promise((resolve, reject) => {
    const tx = db.transaction(STORE_NAME, "readwrite");
    const store = tx.objectStore(STORE_NAME);
    const request = store.delete(id);

    request.onsuccess = () => resolve();
    request.onerror = () => reject(request.error);
  });
}

// ---------------------------------------------
// Helpers
// ---------------------------------------------

function formatDate(timestamp) {
  const date = new Date(timestamp);
  return date.toLocaleDateString(undefined, {
    year: "numeric",
    month: "long",
    day: "numeric",
  });
}

// ---------------------------------------------
// DOM references
// ---------------------------------------------

const feed = document.getElementById("feed");
const feedEmpty = document.getElementById("feedEmpty");
const composerIndex = document.getElementById("composerIndex");
const composerForm = document.getElementById("composerForm");
const titleInput = document.getElementById("titleInput");
const bodyInput = document.getElementById("bodyInput");
const imagesInput = document.getElementById("imagesInput");
const videoInput = document.getElementById("videoInput");

// ---------------------------------------------
// Render
// ---------------------------------------------

async function renderFeed() {
  const posts = await getAllPosts();
  posts.sort((a, b) => b.createdAt - a.createdAt);

  feed.querySelectorAll(".post").forEach((el) => el.remove());
  feedEmpty.style.display = posts.length === 0 ? "block" : "none";
  composerIndex.textContent = "#" + (posts.length + 1);

  posts.forEach((post, i) => {
    const article = document.createElement("article");
    article.className = "post";

    const meta = document.createElement("div");
    meta.className = "post__meta";
    meta.innerHTML = `<span class="post__index">#${posts.length - i}</span><span class="post__date">${formatDate(post.createdAt)}</span>`;

    const content = document.createElement("div");

    const h2 = document.createElement("h2");
    h2.className = "post__title";
    h2.textContent = post.title;
    content.appendChild(h2);

    if (post.body) {
      const p = document.createElement("p");
      p.className = "post__text";
      p.textContent = post.body;
      content.appendChild(p);
    }

    if ((post.images && post.images.length) || post.video) {
      const mediaWrap = document.createElement("div");
      mediaWrap.className = "post__media";

      (post.images || []).forEach((blob) => {
        const img = document.createElement("img");
        img.src = URL.createObjectURL(blob);
        img.alt = post.title;
        mediaWrap.appendChild(img);
      });

      if (post.video) {
        const video = document.createElement("video");
        video.src = URL.createObjectURL(post.video);
        video.controls = true;
        mediaWrap.appendChild(video);
      }

      content.appendChild(mediaWrap);
    }

    const delBtn = document.createElement("button");
    delBtn.type = "button";
    delBtn.className = "post__delete";
    delBtn.textContent = "Delete post";
    delBtn.addEventListener("click", async () => {
      if (!confirm("Delete this post? This can't be undone.")) return;
      await deletePostFromDB(post.id);
      await renderFeed();
    });
    content.appendChild(delBtn);

    article.appendChild(meta);
    article.appendChild(content);
    feed.appendChild(article);
  });
}

// ---------------------------------------------
// Composer submit
// ---------------------------------------------

composerForm.addEventListener("submit", async (event) => {
  event.preventDefault();

  const title = titleInput.value.trim();
  if (!title) return;

  const post = {
    title,
    body: bodyInput.value.trim(),
    images: Array.from(imagesInput.files || []),
    video: videoInput.files && videoInput.files[0] ? videoInput.files[0] : null,
    createdAt: Date.now(),
  };

  await addPostToDB(post);
  composerForm.reset();
  await renderFeed();
});

// ---------------------------------------------
// Init
// ---------------------------------------------

(async function init() {
  try {
    db = await openDB();
    await renderFeed();
  } catch (err) {
    feedEmpty.textContent = "This browser can't run local storage for the blog (" + err.message + ").";
  }
})();
</script>
</body>
</html>
